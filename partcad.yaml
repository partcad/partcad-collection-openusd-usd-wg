# PartCAD package: the USD Working Group's assets as parts, served by a repository plugin.
#
# Published as //pub/collection/openusd/usd-wg/assets: this package is
# //pub/collection/openusd/usd-wg, and its one external dependency 'assets' is
# served by the usd_wg_repo plugin - a child package per part of
# github.com/usd-wg/assets (full-assets, test-assets, intent-vfx), a part per
# asset in it, each 'type: usd', built by PartCAD's own part type of that name.
name: //pub/collection/openusd/usd-wg

desc: |
  The Academy Software Foundation USD Working Group's sample and test assets
  (https://github.com/usd-wg/assets) as PartCAD parts: the Open Chess Set and
  its pieces, the Teapots, the Mini Car Kit, the Carbon Frame Bike, the
  Standard Shader Ball and the rest of its complete assets, its test assets
  and its 'intent-vfx' example. No geometry is vendored: every asset is fetched
  from GitHub when it is first built. Each part carries its asset's own
  licence.
url: https://github.com/usd-wg/assets

# The first release whose //builtin has the 'usd' part type every part here
# is.
partcad: ">=0.9.6"

# Props, scenes and renderer tests made to be looked at: nothing in them says
# they are made to be manufactured. The plugin says the same of 'assets'.
manufacturable: false

docs:
  name: The USD Working Group's assets for PartCAD
  usage: |
    ```shell
    pc list parts //pub/collection/openusd/usd-wg/assets/full-assets
    pc search parts -P '//pub/collection/openusd/usd-wg/assets...' -k teapot
    pc inspect //pub/collection/openusd/usd-wg/assets/full-assets:Teapot
    pc inspect //pub/collection/openusd/usd-wg/assets/full-assets:King
    pc inspect //pub/collection/openusd/usd-wg/assets/test-assets:USDZ_DamagedHelmet
    ```

dependencies:
  assets:
    type: external
    plugin: :usd_wg_repo
    desc: The USD Working Group's assets, a child package per part of the repository and a part per asset.

repositories:
  usd_wg_repo:
    type: basic
    path: usd_wg_repo.py
    desc: Serves github.com/usd-wg/assets as 'usd' parts.
    # Every parameter here is yours to change without touching this package,
    # in your own ~/.partcad/config.yaml, under 'parameters', by the plugin's
    # name:
    #
    #   parameters:
    #     //pub/collection/openusd/usd-wg:usd_wg_repo:
    #       textures: true
    #
    # or, for anything but 'github_token', in a package of your own with an
    # enrich of the plugin (see the README).
    parameters:
      ref:
        type: string
        default: main
        desc: >-
          The branch, tag or commit of github.com/usd-wg/assets to serve. A
          branch is resolved to its commit once a week, and the files are
          fetched at that commit; a commit pins them for good.
      looks:
        type: bool
        default: true
        desc: >-
          Whether a part's USDZ carries what its look is read from: the
          shaders its layers name, and the images of its colour, roughness
          and metalness, each of up to 8 MB. PartCAD's 'usd' part type
          colours each face from them. 'false' carries the layers alone.
      textures:
        type: bool
        default: false
        desc: >-
          Whether a part's USDZ carries every texture its layers name, each
          as it is - normal maps and all - for a package complete enough to
          open in another USD application. PartCAD needs only what 'looks'
          carries.
      max_size_mb:
        type: float
        default: 512
        desc: >-
          The most a part's USDZ may be, in MB: it crosses to PartCAD in one
          answer. An asset larger than this is refused, saying so.
      # Empty here, and meant to stay so: a credential is the user's own.
      github_token:
        type: string
        default: ""
        desc: >-
          A GitHub token, to ask GitHub's API with more than the 60 requests
          an hour it allows anybody; the plugin asks it twice a week, so this
          is rarely needed. Any token will do: the repository is public.
          GITHUB_TOKEN gives it too, where the plugin's sandbox sees the
          environment. Set it in your ~/.partcad/config.yaml; never in a
          package.
